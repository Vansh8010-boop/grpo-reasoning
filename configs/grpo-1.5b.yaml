# Week 4 main run: Qwen2.5-1.5B-Instruct + LoRA on Kaggle's two T4s (fp16).
# Training on GPU 0, vLLM rollouts and validation on GPU 1.
# lr 1e-5: 3e-5 collapsed on 0.5B (docs/week3.md).
model: Qwen/Qwen2.5-1.5B-Instruct
run_name: grpo-1.5b
dtype: float16
steps: 500
problems_per_step: 16
group_size: 8
temperature: 0.9
max_tokens: 512
rollout_backend: vllm
vllm_gpu: 1
vllm_gpu_mem: 0.85
train_filter: results/filter/solve-rates-1.5b.jsonl
filter_max_solved: 8
skip_zero_std_groups: true
micro_batch_size: 8
lr: 1.0e-5
warmup_steps: 10
clip_eps: 0.2
kl_beta: 0.04
lora_r: 16
lora_alpha: 32
correct_weight: 1.0
format_weight: 0.2
length_weight: 0.0
eval_every: 50
val_size: 500
save_every: 50
samples_every: 50
